<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spillgebees.Blazor.Map integration tests</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Map/Spillgebees.Blazor.Map.lib.module.css" />
    <style>
        html,
        body,
        #app {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #111827;
            background: #f9fafb;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #0f172a;
            background: #f1f5f9;
        }

        .e2e-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        .e2e-shell h1 {
            margin: 0 0 4px;
            font-size: 22px;
            letter-spacing: -0.01em;
        }

        .e2e-shell h2 {
            margin: 20px 0 8px;
            font-size: 15px;
            color: #334155;
        }

        .e2e-shell > p {
            margin: 0 0 16px;
            max-width: 75ch;
            color: #64748b;
            font-size: 14px;
        }

        .e2e-shell code {
            font-size: 12px;
            padding: 1px 5px;
            border-radius: 5px;
            background: #e2e8f0;
            color: #0f172a;
        }

        .e2e-shell a {
            color: #2563eb;
        }

        .stress-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 14px;
            align-items: flex-end;
            margin-bottom: 16px;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        }

        .stress-controls label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #64748b;
        }

        .stress-controls select {
            font: 13px/1.4 system-ui, sans-serif;
            color: #0f172a;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
        }

        .stress-controls select:hover {
            border-color: #94a3b8;
        }

        .stress-controls button {
            font: 600 13px/1.2 system-ui, sans-serif;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            background: #2563eb;
            color: #ffffff;
        }

        .stress-controls button:hover {
            background: #1d4ed8;
        }

        .stress-controls button + button {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .stress-controls button + button:hover {
            background: #e2e8f0;
        }

        .stress-status {
            margin-left: auto;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .stress-map-frame {
            position: relative;
            padding: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            background-image:
                linear-gradient(45deg, rgba(15, 23, 42, 0.10) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(15, 23, 42, 0.10) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(15, 23, 42, 0.10) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(15, 23, 42, 0.10) 75%);
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-size: 24px 24px;
        }

        .stress-diagnostics {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            min-width: 220px;
            padding: 10px 12px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            border-radius: 10px;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.82);
            font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            pointer-events: none;
        }

        .stress-diagnostics button {
            pointer-events: auto;
            margin-top: 6px;
            font: inherit;
        }

        .stress-heartbeat {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 6px;
            border-radius: 999px;
            background: #22c55e;
            animation: stress-heartbeat 900ms infinite ease-in-out;
        }

        @keyframes stress-heartbeat {
            0%, 100% { transform: scale(0.75); opacity: 0.45; }
            50% { transform: scale(1.25); opacity: 1; }
        }
    </style>
</head>

<body>
    <div id="app">Loading...</div>
    <script src="stress-diagnostics.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
