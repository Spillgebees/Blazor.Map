<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spillgebees.Blazor.Map — Docs</title>
    <base href="/" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Docs.Sdk/docs-sdk.css" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Map/Spillgebees.Blazor.Map.lib.module.css" />
    <style>
        .doc-content li {
            color: var(--color-text-secondary);
        }

        .sample-btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .sample-btn {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.1s, border-color 0.1s, background 0.1s;
        }

        .sample-btn:hover {
            color: var(--color-text);
            background: var(--color-surface-overlay);
        }

        .sample-btn.active {
            color: var(--color-primary);
            border-color: var(--color-primary);
            background: rgba(200, 160, 80, 0.08);
        }

        .docs-pixel-ratio-control {
            display: grid;
            gap: 2px;
            padding: 7px 10px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.25;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .docs-pixel-ratio-label {
            color: var(--color-text-muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Camera-follow sample: a readable single-column control panel beside the map on wide screens,
           stacking above it on narrow ones. */
        .follow-layout {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .follow-panel {
            flex: 1 1 22rem;
            max-width: 30rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 1rem 1.15rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 10px;
        }

        .follow-map {
            flex: 2 1 26rem;
            min-width: 0;
        }

        /* Sections group the options by role and give the panel a clear top-to-bottom reading order. */
        .follow-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .follow-group + .follow-group {
            padding-top: 0.8rem;
            border-top: 1px solid var(--color-border);
        }

        .follow-group-title {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text);
        }

        .follow-group-note {
            margin-left: 0.45rem;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: var(--color-text-muted);
        }

        .follow-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .follow-field-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text-muted);
        }

        .follow-field-note {
            opacity: 0.65;
        }

        .follow-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .follow-options .sample-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Pitch and bearing are governed by the orientation gesture, so nest them under it with an accent. */
        .follow-subfields {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-left: 0.3rem;
            padding-left: 0.75rem;
            border-left: 2px solid var(--color-primary);
        }

        .follow-status {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--color-text-secondary);
        }

        /* Interaction metadata sample: page-level field guide rather than map-owned chrome. */
        .interaction-example {
            --interaction-accent: var(--color-primary);
        }

        .interaction-example-toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0.9rem;
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-bottom: 0;
        }

        .interaction-example-toolbar > div {
            display: grid;
            gap: 0.12rem;
        }

        .interaction-example-toolbar strong {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            letter-spacing: 0.015em;
        }

        .interaction-example-toolbar span {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .interaction-help-trigger {
            display: inline-flex;
            flex: 0 0 auto;
            gap: 0.45rem;
            align-items: center;
            min-height: 2.35rem;
            padding: 0.45rem 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: #16130c;
            cursor: pointer;
            background: var(--color-primary);
            border: 1px solid var(--color-primary);
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        }

        .interaction-help-trigger:hover {
            filter: brightness(1.08);
        }

        .interaction-help-trigger:focus-visible,
        .interaction-reference-close:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 3px;
        }

        .interaction-help-trigger svg {
            width: 1.05rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.7;
        }

        .interaction-reference-popover {
            position: fixed;
            inset: 0;
            width: min(61rem, calc(100vw - 2rem));
            max-width: none;
            max-height: min(84vh, 52rem);
            max-height: min(84dvh, 52rem);
            padding: 0;
            margin: auto;
            overflow: auto;
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.55);
        }

        .interaction-reference-popover::backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
        }

        .interaction-reference-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            justify-content: space-between;
            padding: 1rem 1.1rem;
            background: var(--color-surface-overlay);
            border-bottom: 1px solid var(--color-border);
        }

        .interaction-reference-header h2,
        .interaction-reference-header p {
            margin: 0;
        }

        .interaction-reference-header h2 {
            margin-top: 0.15rem;
            font-size: clamp(1.15rem, 3vw, 1.55rem);
            line-height: 1.15;
        }

        .interaction-reference-header p {
            max-width: 44rem;
            margin-top: 0.35rem;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        .interaction-reference-close {
            display: grid;
            flex: 0 0 auto;
            width: 2.2rem;
            height: 2.2rem;
            padding: 0;
            color: var(--color-text);
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 50%;
            place-items: center;
        }

        .interaction-reference-close:hover {
            color: var(--color-primary);
            background: var(--color-surface);
        }

        .interaction-reference-close svg {
            width: 1.05rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-width: 1.8;
        }

        .interaction-reference-groups {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .interaction-reference-group {
            min-width: 0;
            padding: 1rem;
            border-right: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
        }

        .interaction-reference-group:nth-child(2n) {
            border-right: 0;
        }

        .interaction-reference-group h3 {
            margin: 0 0 0.65rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.11em;
        }

        .interaction-reference-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.45rem;
        }

        .interaction-reference-row {
            display: grid;
            grid-template-columns: 3.75rem minmax(0, 1fr);
            gap: 0.65rem;
            align-items: center;
            min-width: 0;
            padding: 0.5rem;
            background: var(--color-surface-overlay);
            border: 1px solid var(--color-border);
        }

        .interaction-reference-copy {
            display: grid;
            gap: 0.12rem;
            min-width: 0;
        }

        .interaction-reference-copy strong,
        .interaction-reference-copy span {
            overflow-wrap: anywhere;
        }

        .interaction-reference-copy strong {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            line-height: 1.25;
        }

        .interaction-reference-copy span {
            font-size: 0.66rem;
            color: var(--color-text-muted);
        }

        .interaction-gesture-visual {
            position: relative;
            display: grid;
            width: 3.5rem;
            min-height: 2.9rem;
            color: var(--color-text-secondary);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            place-items: center;
        }

        .interaction-gesture-visual.keyboard-gesture-visual {
            width: 3.75rem;
            min-height: 3.1rem;
        }

        .interaction-gesture-visual svg {
            width: 2.8rem;
            height: 2.25rem;
            overflow: visible;
        }

        .interaction-gesture-visual .device,
        .interaction-gesture-visual .device-detail,
        .interaction-gesture-visual .motion {
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .interaction-gesture-visual .device {
            stroke-width: 1.5;
        }

        .interaction-gesture-visual .device-detail {
            opacity: 0.45;
            stroke-width: 1;
        }

        .interaction-gesture-visual .active-button,
        .interaction-gesture-visual .active-wheel,
        .interaction-gesture-visual .finger {
            fill: var(--color-primary);
            stroke: color-mix(in srgb, var(--color-primary) 60%, black);
            stroke-width: 0.75;
        }

        .interaction-gesture-visual .motion,
        .interaction-gesture-visual .selection-box,
        .interaction-gesture-visual .tap-ring,
        .interaction-gesture-visual .click-mark {
            fill: none;
            color: var(--color-primary);
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.45;
        }

        .interaction-gesture-visual .selection-box {
            stroke-dasharray: 2 2;
        }

        .interaction-gesture-visual .tap-ring {
            opacity: 0.8;
            stroke-width: 1.1;
        }

        .interaction-gesture-visual .tap-ring-outer {
            opacity: 0.35;
        }

        .interaction-gesture-visual .key-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 0.17rem;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }

        .interaction-gesture-visual .key-cluster kbd,
        .interaction-gesture-visual .arrow-key-grid kbd {
            min-width: 1.25rem;
            padding: 0.2rem 0.32rem;
            font: 700 0.62rem/1 var(--font-mono);
            color: var(--color-text);
            text-align: center;
            background: var(--color-surface-overlay);
            border: 1px solid var(--color-border);
            border-bottom: 2px solid var(--color-primary);
        }

        .interaction-gesture-visual .key-cluster .direction-key {
            display: grid;
            width: 1.55rem;
            min-height: 1.05rem;
            padding-inline: 0;
            place-items: center;
        }

        .interaction-gesture-visual .arrow-key-grid {
            display: grid;
            grid-template-columns: repeat(3, 0.9rem);
            grid-template-rows: repeat(2, 0.9rem);
            gap: 0.1rem;
        }

        .interaction-gesture-visual .arrow-key-grid kbd {
            display: grid;
            width: 0.9rem;
            min-width: 0;
            height: 0.9rem;
            padding: 0;
            place-items: center;
        }

        .interaction-gesture-visual .key-arrow {
            width: 0.75rem;
            height: 0.75rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.5;
        }

        .interaction-gesture-visual .direction-key .key-arrow {
            width: 0.85rem;
            height: 0.85rem;
        }

        .interaction-gesture-visual .arrow-key-up {
            grid-column: 2;
        }

        .interaction-gesture-visual .arrow-key-left {
            grid-row: 2;
            grid-column: 1;
        }

        .interaction-gesture-visual .arrow-key-down {
            grid-row: 2;
            grid-column: 2;
        }

        .interaction-gesture-visual .arrow-key-right {
            grid-row: 2;
            grid-column: 3;
        }

        @media (max-width: 760px) {
            .interaction-example-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .interaction-help-trigger {
                justify-content: center;
                width: 100%;
            }

            .interaction-reference-popover {
                top: max(0.5rem, env(safe-area-inset-top));
                right: max(0.5rem, env(safe-area-inset-right));
                bottom: max(0.5rem, env(safe-area-inset-bottom));
                left: max(0.5rem, env(safe-area-inset-left));
                width: auto;
                height: auto;
                max-height: none;
                margin: 0;
                overscroll-behavior: contain;
            }

            .interaction-reference-groups,
            .interaction-reference-list {
                grid-template-columns: 1fr;
            }

            .interaction-reference-group,
            .interaction-reference-group:nth-child(2n) {
                border-right: 0;
            }
        }

    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.SpillgebeesDocs = window.SpillgebeesDocs || {};
        window.SpillgebeesDocs.getDevicePixelRatio = () => window.devicePixelRatio || 1;
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
