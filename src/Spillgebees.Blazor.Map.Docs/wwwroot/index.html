<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spillgebees.Blazor.Map — Docs</title>
    <base href="/" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Docs.Sdk/docs-sdk.css" />
    <link rel="stylesheet" href="_content/Spillgebees.Blazor.Map/Spillgebees.Blazor.Map.lib.module.css" />
    <style>
        .doc-content li {
            color: var(--color-text-secondary);
        }

        .sample-btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .sample-btn {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.1s, border-color 0.1s, background 0.1s;
        }

        .sample-btn:hover {
            color: var(--color-text);
            background: var(--color-surface-overlay);
        }

        .sample-btn.active {
            color: var(--color-primary);
            border-color: var(--color-primary);
            background: rgba(200, 160, 80, 0.08);
        }

        .docs-pixel-ratio-control {
            display: grid;
            gap: 2px;
            padding: 7px 10px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.25;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .docs-pixel-ratio-label {
            color: var(--color-text-muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Camera-follow sample: a readable single-column control panel beside the map on wide screens,
           stacking above it on narrow ones. */
        .follow-layout {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .follow-panel {
            flex: 1 1 22rem;
            max-width: 30rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 1rem 1.15rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 10px;
        }

        .follow-map {
            flex: 2 1 26rem;
            min-width: 0;
        }

        /* Sections group the options by role and give the panel a clear top-to-bottom reading order. */
        .follow-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .follow-group + .follow-group {
            padding-top: 0.8rem;
            border-top: 1px solid var(--color-border);
        }

        .follow-group-title {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text);
        }

        .follow-group-note {
            margin-left: 0.45rem;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: var(--color-text-muted);
        }

        .follow-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .follow-field-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text-muted);
        }

        .follow-field-note {
            opacity: 0.65;
        }

        .follow-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .follow-options .sample-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Pitch and bearing are governed by the orientation gesture, so nest them under it with an accent. */
        .follow-subfields {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-left: 0.3rem;
            padding-left: 0.75rem;
            border-left: 2px solid var(--color-primary);
        }

        .follow-status {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--color-text-secondary);
        }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        window.SpillgebeesDocs = window.SpillgebeesDocs || {};
        window.SpillgebeesDocs.getDevicePixelRatio = () => window.devicePixelRatio || 1;
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
